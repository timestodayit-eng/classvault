<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{site_name}}</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/otp.js"></script>
<style>
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero-l{background:linear-gradient(150deg,var(--brand-deep),var(--brand) 45%,#7c3aed);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.hero-l h1{font-size:40px;line-height:1.25;margin:0 0 14px}
.hero-l p{opacity:.85;font-size:17px;max-width:440px}
.feat{display:grid;gap:12px;margin-top:28px}
.feat div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.1);padding:12px 16px;border-radius:12px;max-width:420px}
.hero-r{display:grid;place-items:center;padding:32px}
.login{width:100%;max-width:400px;padding:34px}
.login h2{margin:0 0 4px;font-size:24px}
.classes{display:grid;gap:30px}
.cls h2{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.vcard{overflow:hidden;cursor:pointer;transition:.18s;display:block;color:inherit}
.vcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,24,50,.12)}
.thumb{aspect-ratio:16/9;background:#1e1b4b center/cover;position:relative}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:1px 7px;border-radius:6px}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.2s;background:rgba(0,0,0,.25)}
.vcard:hover .play{opacity:1}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--brand);font-size:20px}
.vbody{padding:14px 16px}
.vbody h3{margin:0 0 8px;font-size:16px;line-height:1.35}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1}
.empty{padding:60px;text-align:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero-l{padding:32px 24px}.hero-l h1{font-size:28px}.feat{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const B = window.BRAND || {};
const lines = (t) => esc(t).replace(/\n/g, '<br>');
const bn = (n) => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
document.addEventListener('contextmenu', e => e.preventDefault());

async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'সমস্যা হয়েছে'), { status: r.status });
  return j;
}

function renderLogin() {
  $('#app').innerHTML = `
  ${themeBtn('float')}
  <div class="hero">
    <div class="hero-l">
      <div class="logo" style="color:#fff">${B.logo_html}</div>
      <div>
        <h1>${lines(B.hero_title)}</h1>
        <p>${lines(B.hero_text)}</p>
        <div class="feat">${String(B.features || '').split('\n').filter(x => x.trim()).map(x => `<div>${esc(x)}</div>`).join('')}</div>
      </div>
      <small style="opacity:.6">${esc(B.footer)}</small>
    </div>
    <div class="hero-r">
      <div class="card login">
        <h2>${esc(B.login_title)}</h2>
        <div class="muted">${lines(B.login_sub)}</div>
        <div id="otp"></div>
      </div>
    </div>
  </div>`;
  otpLogin($('#otp'), { via: 'login', onDone: () => boot() });
}

async function renderCatalog(me) {
  const classes = await api('/api/catalog');
  const total = classes.reduce((s, c) => s + c.videos.length, 0);
  const done = classes.reduce((s, c) => s + c.videos.filter(v => v.completed).length, 0);
  $('#app').innerHTML = `
  <div class="topbar">
    <div class="logo">${B.logo_html}</div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="muted">👋 ${esc(me.name)}</span>${themeBtn()}
      <button class="btn ghost sm" id="out">বের হন</button>
    </div>
  </div>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:26px">
      <div><h1 style="margin:0;font-size:26px">${esc(B.catalog_title)}</h1>
      <div class="muted">মোট ${bn(total)}টি ভিডিও · ${bn(done)}টি শেষ করেছেন</div></div>
    </div>
    <div class="classes">
    ${classes.filter(c => c.videos.length).map(c => `
      <section class="cls">
        <h2>${esc(c.name)} <span class="pill">${bn(c.videos.length)}টি ভিডিও</span></h2>
        <div class="grid">
        ${c.videos.map(v => `
          <a class="card vcard" href="/watch?v=${v.id}">
            <div class="thumb" style="background-image:url(/api/thumb/${v.id})">
              <div class="play"><span>▶</span></div><span class="dur">${fmt(v.duration)}</span>
            </div>
            <div class="vbody">
              <h3>${esc(v.title)}</h3>
              <div class="prog">
                ${v.completed ? '<span class="pill ok">✓ শেষ</span>' : v.percent ? `<div class="bar"><i style="width:${v.percent}%"></i></div> ${bn(Math.round(v.percent))}%` : '<span class="pill brand">নতুন</span>'}
              </div>
            </div>
          </a>`).join('')}
        </div>
      </section>`).join('') || '<div class="card empty muted">🔒 এখনো আপনাকে কোনো ভিডিও শেয়ার করা হয়নি।<br>শিক্ষকের দেওয়া ভিডিও লিংকে ক্লিক করলে ভিডিওটি এখানে চলে আসবে।</div>'}
    </div>
    <div class="muted" style="text-align:center;font-size:13px;margin-top:40px">${esc(B.footer)}</div>
  </div>`;
  $('#out').onclick = async () => { await api('/api/logout', {}); renderLogin(); };
}

async function boot() {
  try { const me = await api('/api/me'); await renderCatalog(me); } catch { renderLogin(); }
}
boot();
</script>
</body>
</html>
