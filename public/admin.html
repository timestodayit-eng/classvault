<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যাডমিন | ক্লাসভল্ট</title>
<link rel="stylesheet" href="/css/app.css">
<style>
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#14152a;color:#c9cbe6;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .logo{color:#fff;margin:0 8px 26px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c9cbe6;font-weight:600;margin-bottom:4px}
.nav a.on,.nav a:hover{background:#25274a;color:#fff}
.main{padding:28px 32px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.panel{padding:0;overflow:hidden}
.panel>h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.scroll{overflow-x:auto}
.cls-block{margin-bottom:18px}
.cls-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.cls-head h3{margin:0;font-size:17px}
.vrow{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vthumb{width:96px;aspect-ratio:16/9;border-radius:8px;background:#1e1b4b center/cover}
.vmeta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(15,17,35,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{width:100%;max-width:520px;padding:24px;max-height:90vh;overflow:auto}
.modal.wide{max-width:860px}
.modal h2{margin:0 0 6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.has{border-color:var(--brand);color:var(--text);background:var(--brand-soft)}
.upbar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;margin-top:12px;display:none}
.upbar i{display:block;height:100%;background:var(--brand);width:0}
.heat{display:flex;gap:2px;align-items:flex-end;height:90px;padding:10px 0}
.heat i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}
.heat.p i{background:var(--warn)}
.heat.r i{background:#6d28d9}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:86px 70px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:center}
.tl .t{color:var(--muted);font-variant-numeric:tabular-nums}
.tl .p{font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.prof{display:flex;gap:16px;align-items:center;padding:20px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;flex-shrink:0}
.ranges{position:relative;height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;min-width:120px}
.ranges i{position:absolute;top:0;bottom:0;background:var(--ok)}
.search{max-width:280px}
.loginbox{min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,#14152a,#2b2870)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;overflow-x:auto;padding:10px}.side .logo{margin:0}.nav{display:flex;gap:4px}.nav a{margin:0;white-space:nowrap}.cols{grid-template-columns:1fr}.main{padding:18px 14px}.side .foot{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/js/admin.js"></script>
</body>
</html>
